[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swecraft-evaluator"
version = "0.2.0"
description = "Deterministic evaluation plans and execution for SWECraft societies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "swecraft-common",
    "swecraft-world",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
    "typer>=0.16,<1",
]

[project.scripts]
swecraft-evaluator = "swecraft_evaluator.cli:app"

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.uv.sources]
swecraft-common = { workspace = true }
swecraft-world = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/swecraft_evaluator"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
