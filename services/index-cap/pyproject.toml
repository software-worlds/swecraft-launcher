[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swecraft-index-cap"
version = "0.1.0"
description = "A view of PyPI as it stood on a date: the package index a seeded world installs from"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
swecraft-index-cap = "swecraft_index_cap.cli:main"

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/swecraft_index_cap"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
