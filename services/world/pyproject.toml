[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swecraft-world"
version = "0.1.0"
description = "Versioned world manifest and seed-lock protocol for SWECraft"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.18,<4",
    "swecraft-common",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
    "typer>=0.16,<1",
]

[project.scripts]
swecraft-world = "swecraft_world.cli:app"

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.uv.sources]
swecraft-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/swecraft_world"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
