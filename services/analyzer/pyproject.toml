[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swecraft-analyzer"
version = "0.2.0"
description = "Evidence tables over one society checkpoint"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "swecraft-runner",
]

[project.scripts]
swecraft-analyzer = "swecraft_analyzer.cli:main"

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.uv.sources]
swecraft-runner = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/swecraft_analyzer"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
