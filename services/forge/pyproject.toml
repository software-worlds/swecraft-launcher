[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swecraft-forge"
version = "0.1.0"
description = "Forge runtime and frozen-state adapters for SWECraft societies"
requires-python = ">=3.12"
dependencies = [
    "swecraft-common",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.uv.sources]
swecraft-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/swecraft_forge"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
