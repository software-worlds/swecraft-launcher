[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swecraft-society"
version = "0.1.0"
description = "Versioned pack/load protocol for sharing whole society simulations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "swecraft-common",
    "swecraft-coordinator",
    "swecraft-evaluator",
    "swecraft-forge",
    "swecraft-world",
    "huggingface-hub>=0.34,<2",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
    "typer>=0.16,<1",
]

[project.scripts]
swecraft-society = "swecraft_society.cli:app"

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.uv.sources]
swecraft-common = { workspace = true }
swecraft-coordinator = { workspace = true }
swecraft-evaluator = { workspace = true }
swecraft-forge = { workspace = true }
swecraft-world = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/swecraft_society"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
