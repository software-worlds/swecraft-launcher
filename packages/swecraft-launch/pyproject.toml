[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swecraft-launch"
version = "0.1.0"
description = "Run one experiment end to end from an experiment folder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6,<7"]

[project.scripts]
swecraft-launch = "swecraft_launch.cli:main"

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/swecraft_launch"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
