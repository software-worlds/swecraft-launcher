[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swecraft-common"
version = "0.1.0"
description = "Shared host-Git, Forgejo, and run-ID primitives for SWECraft"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["filelock>=3.18,<4", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/swecraft_common"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
